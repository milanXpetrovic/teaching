<header>Uvod i C++ osnove</header>
<h1 id="template-za-rje%C5%A1avanje-zadataka">Template za rješavanje zadataka</h1>
<p>Većina rješenja počinje ovim predloškom:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;bits/stdc++.h&gt;</span> <span class="hljs-comment">// Uključuje sve standardne biblioteke</span></span>
<span class="hljs-keyword">using</span> <span class="hljs-keyword">namespace</span> std;

<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span> </span>{
    <span class="hljs-comment">// Optimizacija ulaza/izlaza</span>
    ios::<span class="hljs-built_in">sync_with_stdio</span>(<span class="hljs-number">0</span>);
    cin.<span class="hljs-built_in">tie</span>(<span class="hljs-number">0</span>);

    <span class="hljs-comment">// Rješenje ide ovdje</span>
    <span class="hljs-type">int</span> n;
    cin &gt;&gt; n;
    cout &lt;&lt; n &lt;&lt; <span class="hljs-string">&quot;\n&quot;</span>;

    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Uvod i C++ osnove" data-footer="Programiranje za rješavanje složenih problema | Vježbe" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:Uvod i C++ osnove;--footer:Programiranje za rješavanje složenih problema | Vježbe;" data-marpit-pagination-total="29" data-size="16:9">
<header>Uvod i C++ osnove</header>
<h1 id="ulaz-i-izlaz-io">Ulaz i izlaz (I/O)</h1>
<p>Standardni <code>cin</code> i <code>cout</code> mogu biti spori.</p>
<p><strong>Ključne optimizacije:</strong></p>
<ol>
<li><code>ios::sync_with_stdio(0);</code> - Isključuje sinkronizaciju s C-stilom I/O.</li>
<li><code>cin.tie(0);</code> - Odvaja <code>cin</code> od <code>cout</code> (ne flusha se buffer prije svakog unosa).</li>
<li>Koristite <code>\n</code> umjesto <code>endl</code>.
<ul>
<li><code>endl</code> forsira ispis (flush), što je sporo u petljama.</li>
</ul>
</li>
</ol>
<footer>Programiranje za rješavanje složenih problema | Vježbe</footer>

<h1 id="vector-dinami%C4%8Dko-polje">Vector (Dinamičko polje)</h1>
<p>Najčešće korištena struktura.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">vector&lt;<span class="hljs-type">int</span>&gt; v;
v.<span class="hljs-built_in">push_back</span>(<span class="hljs-number">3</span>);  <span class="hljs-comment">// [3]</span>
v.<span class="hljs-built_in">push_back</span>(<span class="hljs-number">5</span>);  <span class="hljs-comment">// [3, 5]</span>
v.<span class="hljs-built_in">push_back</span>(<span class="hljs-number">2</span>);  <span class="hljs-comment">// [3, 5, 2]</span>

<span class="hljs-comment">// Iteracija</span>
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> x : v) {
    cout &lt;&lt; x &lt;&lt; <span class="hljs-string">&quot; &quot;</span>;
}

<span class="hljs-comment">// Sortiranje</span>
<span class="hljs-built_in">sort</span>(v.<span class="hljs-built_in">begin</span>(), v.<span class="hljs-built_in">end</span>()); <span class="hljs-comment">// [2, 3, 5]</span>

</code></pre>

</li>

<li><strong>Time Limit Exceeded (TLE):</strong> Rješenje je presporo.</li>

<h1 id="analiza-zadatka-watermelon">Analiza zadatka: Watermelon</h1>
<p><strong>Problem:</strong><br />
Pete i Billy su kupili lubenicu težine <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.62ex" height="1.027ex" role="img" focusable="false" viewBox="0 -443 716 454"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D464" d="M580 385Q580 406 599 424T641 443Q659 443 674 425T690 368Q690 339 671 253Q656 197 644 161T609 80T554 12T482 -11Q438 -11 404 5T355 48Q354 47 352 44Q311 -11 252 -11Q226 -11 202 -5T155 14T118 53T104 116Q104 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Q21 293 29 315T52 366T96 418T161 441Q204 441 227 416T250 358Q250 340 217 250T184 111Q184 65 205 46T258 26Q301 26 334 87L339 96V119Q339 122 339 128T340 136T341 143T342 152T345 165T348 182T354 206T362 238T373 281Q402 395 406 404Q419 431 449 431Q468 431 475 421T483 402Q483 389 454 274T422 142Q420 131 420 107V100Q420 85 423 71T442 42T487 26Q558 26 600 148Q609 171 620 213T632 273Q632 306 619 325T593 357T580 385Z"></path></g></g></g></svg></mjx-container> kilograma. Žele je podijeliti na dva dijela tako da:</p>
<ol>
<li>Svaki dio ima <strong>parnu</strong> težinu.</li>
<li>Svaki dio ima <strong>pozitivnu</strong> težinu (veću od 0).</li>
<li>Dijelovi ne moraju biti jednaki.</li>
</ol>
<p><strong>Pitanje:</strong><br />

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;iostream&gt;</span></span>

<span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span> </span>{

    cin &gt;&gt; w;

    }

}
