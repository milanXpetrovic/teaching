<header>Algoritmi na stablima i LCA</header>
<h1 id="definicija-i-svojstva">Definicija i svojstva</h1>
<p><strong>Stablo</strong> je povezan graf koji se sastoji od <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.009ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 888 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D441" d="M234 637Q231 637 226 637Q201 637 196 638T191 649Q191 676 202 682Q204 683 299 683Q376 683 387 683T401 677Q612 181 616 168L670 381Q723 592 723 606Q723 633 659 637Q635 637 635 648Q635 650 637 660Q641 676 643 679T653 683Q656 683 684 682T767 680Q817 680 843 681T873 682Q888 682 888 672Q888 650 880 642Q878 637 858 637Q787 633 769 597L620 7Q618 0 599 0Q585 0 582 2Q579 5 453 305L326 604L261 344Q196 88 196 79Q201 46 268 46H278Q284 41 284 38T282 19Q278 6 272 0H259Q228 2 151 2Q123 2 100 2T63 2T46 1Q31 1 31 10Q31 14 34 26T39 40Q41 46 62 46Q130 49 150 85Q154 91 221 362L289 634Q287 635 234 637Z"></path></g></g></g></svg></mjx-container> čvorova i <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="5.906ex" height="1.731ex" role="img" focusable="false" viewBox="0 -683 2610.4 765"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D441" d="M234 637Q231 637 226 637Q201 637 196 638T191 649Q191 676 202 682Q204 683 299 683Q376 683 387 683T401 677Q612 181 616 168L670 381Q723 592 723 606Q723 633 659 637Q635 637 635 648Q635 650 637 660Q641 676 643 679T653 683Q656 683 684 682T767 680Q817 680 843 681T873 682Q888 682 888 672Q888 650 880 642Q878 637 858 637Q787 633 769 597L620 7Q618 0 599 0Q585 0 582 2Q579 5 453 305L326 604L261 344Q196 88 196 79Q201 46 268 46H278Q284 41 284 38T282 19Q278 6 272 0H259Q228 2 151 2Q123 2 100 2T63 2T46 1Q31 1 31 10Q31 14 34 26T39 40Q41 46 62 46Q130 49 150 85Q154 91 221 362L289 634Q287 635 234 637Z"></path></g><g data-mml-node="mo" transform="translate(1110.2,0)"><path data-c="2212" d="M84 237T84 250T98 270H679Q694 262 694 250T679 230H98Q84 237 84 250Z"></path></g><g data-mml-node="mn" transform="translate(2110.4,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></svg></mjx-container> bridova te ne sadrži cikluse.</p>
<p><strong>Ključna svojstva:</strong></p>
<ol>
<li>Između bilo koja dva čvora postoji točno jedan jednostavan put.</li>
<li>Dodavanjem bilo kojeg brida stvara se ciklus.</li>
<li>Micanjem bilo kojeg brida stablo prestaje biti povezano.</li>
</ol>
<p><strong>Terminologija:</strong></p>
<ul>
<li><strong>Korijen (root):</strong> fiksirani čvor od kojeg &quot;visi&quot; stablo.</li>
<li><strong>List (leaf):</strong> čvor bez djece (u ukorijenjenom stablu) ili stupnja 1.</li>
<li><strong>Dubina (depth):</strong> udaljenost čvora od korijena.</li>
<li><strong>Podstablo (subtree):</strong> čvor i svi njegovi potomci.</li>
</ul>
<footer>Programiranje za rješavanje složenih problema | Vježbe</footer>

<h2 id="dfs-poredak-i-linearizacija">DFS poredak i linearizacija</h2>
<footer>Programiranje za rješavanje složenih problema | Vježbe</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Algoritmi na stablima i LCA" data-footer="Programiranje za rješavanje složenih problema | Vježbe" data-theme="uniri-beam" lang="C" data-marpit-pagination="6" style="--paginate:true;--header:Algoritmi na stablima i LCA;--footer:Programiranje za rješavanje složenih problema | Vježbe;--theme:uniri-beam;" data-marpit-pagination-total="39" data-size="16:9">
<header>Algoritmi na stablima i LCA</header>
<h1 id="linearizacija-stabla-tree-flattening">Linearizacija stabla (tree flattening)</h1>
<p>Osim samog posjećivanja, korisno je pamtiti <strong>ulazna (entry)</strong> i <strong>izlazna (exit)</strong> vremena za svaki čvor.<br />
To nam omogućuje da stablo preslikamo na ravni niz.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">vector&lt;<span class="hljs-type">int</span>&gt; adj[MAXN];
<span class="hljs-type">int</span> tin[MAXN], tout[MAXN], timer;

<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">dfs</span><span class="hljs-params">(<span class="hljs-type">int</span> u, <span class="hljs-type">int</span> p)</span> </span>{
    tin[u] = ++timer; <span class="hljs-comment">// Vrijeme ulaska</span>

    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> v : adj[u]) {
        <span class="hljs-keyword">if</span> (v != p) <span class="hljs-built_in">dfs</span>(v, u);
    }

    tout[u] = timer;  <span class="hljs-comment">// Vrijeme izlaska (zadnji tin u podstablu)</span>
}
</code></pre>
<p><strong>Svojstvo predaka:</strong><br />

        t.textContent = i + 1;
        var sub = sv('text', { x: p.x + (opt.subdx || 0), y: p.y + (opt.subdy === undefined ? -R - 13 : opt.subdy), 'class': 'sub' }, g);
        return { g: g, sub: sub };
      });
      return { E: E, N: N, svg: svg };
    }

    var tedges = parseEdges(root.dataset.edges);
    var n = tedges.length + 1;
    var adj = [];
    for (var i0 = 0; i0 !== n + 1; i0++) adj.push([]);
    tedges.forEach(function (e, k) { adj[e.a].push([e.b, k]); adj[e.b].push([e.a, k]); });
    // Raspored: listovi redom slijeva nadesno, roditelj iznad sredine svoje djece
    var px = [], py = [], par = [], parE = [], dep = [], leaf = 0, maxd = 0;
    for (var i1 = 0; i1 !== n + 1; i1++) { px.push(0); py.push(0); par.push(0); parE.push(-1); dep.push(0); }
    function layout(u, p, d) {
      par[u] = p; dep[u] = d; maxd = Math.max(maxd, d);
      var kids = adj[u].filter(function (q) { return q[0] !== p; });
      kids.forEach(function (q) { parE[q[0]] = q[1]; layout(q[0], u, d + 1); });
      if (kids.length === 0) { px[u] = leaf; leaf++; }
      else px[u] = (px[kids[0][0]] + px[kids[kids.length - 1][0]]) / 2;
    }
    layout(1, 0, 0);
    var TW = Number(root.dataset.w), TH = Number(root.dataset.h);
    var stepY = (TH - 70) / Math.max(1, maxd), stepX = (TW - 60) / Math.max(1, leaf - 1);
    var pos = [];
    for (var v0 = 1; v0 !== n + 1; v0++) pos.push({ x: 30 + px[v0] * stepX, y: 44 + dep[v0] * stepY });
    var G = drawGraph(root.querySelector('.graph'), pos, tedges, { w: TW, h: TH, directed: false, weights: false, r: Number(root.dataset.r || 20), subdx: root.dataset.subleft ? -36 : 0, subdy: root.dataset.subleft ? 0 : undefined });

    var tin = [], tout = [], order = [], clock = 0;
    for (var i2 = 0; i2 !== n + 1; i2++) { tin.push(0); tout.push(0); }
    var R1 = makeRow(root.querySelector('.rin'), n, 1);
    var R2 = makeRow(root.querySelector('.rout'), n, 1);
    var R3 = makeRow(root.querySelector('.rord'), n, 1);
    var snaps = [];
    function snap(o) {
      var s = { tin: tin.slice(), tout: tout.slice(), order: order.slice(), cur: -1, mode: '', sub: [], rng: [], l1: '', l2: '' };
      Object.keys(o).forEach(function (k) { s[k] = o[k]; });
      snaps.push(s);
    }
    snap({ l1: 'DFS iz korijena 1, timer = 0', l2: 'tin = vrijeme ulaska, tout = zadnji tin u podstablu' });
    function dfs(u, p) {
      tin[u] = ++clock; order.push(u);
      snap({ cur: u, mode: 'in', l1: 'Ulazimo u čvor ' + u + ':  tin[' + u + '] = ' + clock, l2: 'Čvor ' + u + ' dolazi na poziciju ' + clock + ' u ravnom nizu' });
      adj[u].forEach(function (q) { if (q[0] !== p) dfs(q[0], u); });
      tout[u] = clock;
      snap({ cur: u, mode: 'out', l1: 'Izlazimo iz čvora ' + u + ':  tout[' + u + '] = ' + clock, l2: 'Podstablo čvora ' + u + ' zauzima pozicije [' + tin[u] + ', ' + tout[u] + ']' });
    }
    dfs(1, 0);
    function subtree(u) { var r = [u]; adj[u].forEach(function (q) { if (q[0] !== par[u]) r = r.concat(subtree(q[0])); }); return r; }
    root.dataset.sub.split(',').map(Number).forEach(function (u) {
      var rng = [];
      for (var k = tin[u]; k !== tout[u] + 1; k++) rng.push(k);
      snap({ cur: u, sub: subtree(u), rng: rng,
        l1: 'Podstablo čvora ' + u + ' = uzastopni raspon [' + tin[u] + ', ' + tout[u] + '] u ravnom nizu',
        l2: 'Upit nad podstablom postaje upit nad rasponom niza (BIT ili segmentno stablo)   ✓' });
    });
    function draw(s) {
      G.N.forEach(function (nd, x) {
        var v = x + 1, c = 'n';
        if (s.tout[v]) c += ' done';
        if (s.sub.indexOf(v) !== -1) c += ' src';
        if (v === s.cur) c += ' cur';
        setc(nd.g, c);
        nd.sub.textContent = s.tin[v] ? '[' + s.tin[v] + ', ' + (s.tout[v] ? s.tout[v] : '…') + ']' : '';
      });
      G.E.forEach(function (e, k) {
        var b = tedges[k], ch = par[b.a] === b.b ? b.a : b.b;
        setc(e.g, s.tin[ch] ? 'e tree' : 'e');
      });
      R1.cells.forEach(function (cell, k) {
        var v = k + 1;
        setc(cell, (s.tin[v] ? 'cell' : 'cell todo') + (v === s.cur ? ' cur' : ''));
        R1.vals[k].textContent = s.tin[v] ? s.tin[v] : '';
      });
      R2.cells.forEach(function (cell, k) {
        var v = k + 1;
        setc(cell, (s.tout[v] ? 'cell' : 'cell todo') + (v === s.cur ? (s.mode === 'out' ? ' cur' : '') : ''));
        R2.vals[k].textContent = s.tout[v] ? s.tout[v] : '';
      });
      R3.cells.forEach(function (cell, k) {
        var c = 'cell';
        if (s.rng.indexOf(k + 1) !== -1) c += ' src';
        if (s.order[k] === s.cur) c += ' cur';
        setc(cell, c);
        R3.vals[k].textContent = s.order[k] === undefined ? '' : s.order[k];
      });
    }

    var step = 0, timer = null, lastStep = snaps.length - 1;
    function render() {
      var s = snaps[step];
      draw(s);
      line1.textContent = s.l1;
      line2.textContent = s.l2;
    }
    function stopAuto() { clearInterval(timer); timer = null; }
    function next() { if (step !== lastStep) { step++; render(); return true; } stopAuto(); return false; }
    function prev() { if (step !== 0) { step--; render(); return true; } return false; }
    function reset() { stopAuto(); step = 0; render(); }
    var actions = {
      next: next, prev: prev, reset: reset,
      auto: function () { if (timer) stopAuto(); else timer = setInterval(next, 700); }
    };

    root.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation(); b.blur(); actions[b.dataset.act]();
      });
    });

    // Strelice / razmaknica / klikač prvo koračaju kroz animaciju, a tek na kraju mijenjaju slajd
    window.addEventListener('keydown', function (e) {
      if (e.shiftKey || !slide || !slide.classList.contains('bespoke-marp-active')) return;
      var fwd = ['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(e.key) !== -1;
      var back = ['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) !== -1;
      var moved = false;
      if (fwd) moved = next();
      if (back) moved = prev();
      if (moved) {
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    }, true);

    render();
  });
})();
</script>

<p><strong>Promjer stabla</strong> je maksimalna udaljenost između bilo koja dva čvora.</p>

<ol>

tainer>.</li>
<li>Pokrenemo DFS iz čvora <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.717ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 759 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D435" d="M231 637Q204 637 199 638T194 649Q194 676 205 682Q206 683 335 683Q594 683 608 681Q671 671 713 636T756 544Q756 480 698 429T565 360L555 357Q619 348 660 311T702 219Q702 146 630 78T453 1Q446 0 242 0Q42 0 39 2Q35 5 35 10Q35 17 37 24Q42 43 47 45Q51 46 62 46H68Q95 46 128 49Q142 52 147 61Q150 65 219 339T288 628Q288 635 231 637ZM649 544Q649 574 634 600T585 634Q578 636 493 637Q473 637 451 637T416 636H403Q388 635 384 626Q382 622 352 506Q352 503 351 500L320 374H401Q482 374 494 376Q554 386 601 434T649 544ZM595 229Q595 273 572 302T512 336Q506 337 429 337Q311 337 310 336Q310 334 293 263T258 122L240 52Q240 48 252 48T333 46Q422 46 429 47Q491 54 543 105T595 229Z"></path></g></g></g></svg></mjx-container> i pronađemo čvor najudaljeniji od njega. Nazovimo ga <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.719ex" height="1.645ex" role="img" focusable="false" viewBox="0 -705 760 727"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z"></path></g></g></g></svg></mjx-container>.</li>
<li>Udaljenost između <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.717ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 759 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D435" d="M231 637Q204 637 199 638T194 649Q194 676 205 682Q206 683 335 683Q594 683 608 681Q671 671 713 636T756 544Q756 480 698 429T565 360L555 357Q619 348 660 311T702 219Q702 146 630 78T453 1Q446 0 242 0Q42 0 39 2Q35 5 35 10Q35 17 37 24Q42 43 47 45Q51 46 62 46H68Q95 46 128 49Q142 52 147 61Q150 65 219 339T288 628Q288 635 231 637ZM649 544Q649 574 634 600T585 634Q578 636 493 637Q473 637 451 637T416 636H403Q388 635 384 626Q382 622 352 506Q352 503 351 500L320 374H401Q482 374 494 376Q554 386 601 434T649 544ZM595 229Q595 273 572 302T512 336Q506 337 429 337Q311 337 310 336Q310 334 293 263T258 122L240 52Q240 48 252 48T333 46Q422 46 429 47Q491 54 543 105T595 229Z"></path></g></g></g></svg></mjx-container> i <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.719ex" height="1.645ex" role="img" focusable="false" viewBox="0 -705 760 727"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z"></path></g></g></g></svg></mjx-container> je promjer stabla. </foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-s9kHC7DP="" data-paginate="true" data-header="Algoritmi na stablima i LCA" data-footer="Programiranje za rješavanje složenih problema | Vježbe" data-theme="uniri-beam" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:Algoritmi na stablima i LCA;--footer:Programiranje za rješavanje složenih problema | Vježbe;--theme:uniri-beam;" data-marpit-pagination-total="39" data-size="16:9">

<h1 id="promjer-stabla-korak-po-korak">Promjer stabla korak po korak</h1>
<p>Broj iznad čvora je udaljenost od početka trenutnog DFS-a. Žuto je najdalji čvor pronađen do sada.</p>
<div class="tr-diam" data-edges="1-2,1-3,2-4,2-5,3-6,5-7,5-8,6-9" data-w="620" data-h="300">
  <div class="graph"></div>
  <div class="line1"></div>
  <div class="line2"></div>
  <div class="ctrl">
    <button data-act="prev">← Korak</button><button data-act="next">Korak →</button><button data-act="auto">Auto</button><button data-act="reset">Reset</button>
    <span class="hint">← / → koračaju kroz animaciju, Shift + ← / → mijenja slajd</span>
  </div>
</div>
<script>
(function () {
  // Ovaj blok namjerno ne sadrži znakove manje-od, veće-od ni ampersand,
  // jer ih build pretvara u HTML entitete i ruši skriptu.
  document.querySelectorAll('.tr-diam').forEach(function (root) {
    var slide = root.closest('svg');
    var line1 = root.querySelector('.line1');
    var line2 = root.querySelector('.line2');
    var NS = 'http://www.w3.org/2000/svg';
    function mk(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function sv(tag, attrs, parent) {
      var e = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      if (parent) parent.appendChild(e);
      return e;
    }
    function setc(el, cls) { el.setAttribute('class', cls); }
    function show(v) { return v === Infinity ? '∞' : (v === -Infinity ? '−∞' : String(v)); }
    function lt(a, b) { return a !== b ? Math.min(a, b) === a : false; }
    function le(a, b) { return Math.min(a, b) === a; }
    function fw(w) { return lt(w, 0) ? '(' + w + ')' : String(w); }
    function makeRow(box, count, base) {
      var cells = [], vals = [];
      for (var k = 0; k !== count; k++) {
        var cell = mk('div', 'cell');
        cell.appendChild(mk('div', 'idx', k + (base || 0)));
        var v = mk('div', 'val');
        cell.appendChild(v);
        box.appendChild(cell);
        cells.push(cell);
        vals.push(v);
      }
      return { cells: cells, vals: vals };
    }
    function parsePos(s) {
      return s.trim().split(/\s+/).map(function (p) {
        var q = p.split(',').map(Number);
        return { x: q[0], y: q[1] };
      });
    }
    function parseEdges(s) {
      return s.split(',').map(function (t) {
        var q = t.trim().split(':'), ab = q[0].split('-');

    var tedges = parseEdges(root.dataset.edges);

<header>Algoritmi na stablima i LCA</header>
<h1 id="implementacija-preprocessing">Implementacija: preprocessing</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">const</span> <span class="hljs-type">int</span> LOG = <span class="hljs-number">20</span>;
<span class="hljs-type">int</span> up[MAXN][LOG];
<span class="hljs-type">int</span> depth[MAXN];

<span class="hljs-comment">// Poziv: dfs_lca(korijen, 0, 0). Čvor 0 služi kao &quot;iznad korijena&quot;.</span>
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">dfs_lca</span><span class="hljs-params">(<span class="hljs-type">int</span> u, <span class="hljs-type">int</span> p, <span class="hljs-type">int</span> d)</span> </span>{
    depth[u] = d;
    up[u][<span class="hljs-number">0</span>] = p; <span class="hljs-comment">// 2^0 = 1. predak je roditelj</span>

    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">1</span>; i &lt; LOG; i++) {
        up[u][i] = up[up[u][i<span class="hljs-number">-1</span>]][i<span class="hljs-number">-1</span>];
    }

    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> v : adj[u]) {
        <span class="hljs-keyword">if</span> (v != p) <span class="hljs-built_in">dfs_lca</span>(v, u, d + <span class="hljs-number">1</span>);
    }
}
</code></pre>

<header>Algoritmi na stablima i LCA</header>
<h1 id="implementacija-lca-upit">Implementacija: LCA upit</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">get_lca</span><span class="hljs-params">(<span class="hljs-type">int</span> u, <span class="hljs-type">int</span> v)</span> </span>{
    <span class="hljs-keyword">if</span> (depth[u] &lt; depth[v]) <span class="hljs-built_in">swap</span>(u, v); <span class="hljs-comment">// Sada je u dublji</span>

    <span class="hljs-comment">// 1. Izjednačimo dubine: podižemo dubljeg u na razinu v</span>
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = LOG - <span class="hljs-number">1</span>; i &gt;= <span class="hljs-number">0</span>; i--) {
        <span class="hljs-keyword">if</span> (depth[u] - (<span class="hljs-number">1</span> &lt;&lt; i) &gt;= depth[v]) {
            u = up[u][i];
        }
    }

    <span class="hljs-keyword">if</span> (u == v) <span class="hljs-keyword">return</span> u;

    <span class="hljs-comment">// 2. Podižemo oba dok ne budu točno ispod LCA</span>
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = LOG - <span class="hljs-number">1</span>; i &gt;= <span class="hljs-number">0</span>; i--) {
        <span class="hljs-keyword">if</span> (up[u][i] != up[v][i]) {
            u = up[u][i];
            v = up[v][i];
        }
    }
    <span class="hljs-keyword">return</span> up[u][<span class="hljs-number">0</span>]; <span class="hljs-comment">// Vraćamo roditelja</span>
}
</code></pre>

<header>Algoritmi na stablima i LCA</header>
<h1 id="lca-binary-lifting-korak-po-korak">LCA (binary lifting) korak po korak</h1>
<p>Gradimo tablicu <code>up</code>, izjednačimo dubine, zatim skačemo oba čvora dok su im preci različiti.</p>
<div class="tr-lca" data-edges="1-2,1-3,2-4,2-5,4-6,4-7,6-8,8-9,3-10,10-11,11-12" data-w="440" data-h="290" data-r="18" data-subleft="1" data-q="9,7|12,5">
  <div class="wrap">

    <span class="hint">← / → koračaju kroz animaciju, Shift + ← / → mijenja slajd</span>

</div>
<script>
(function () {
  // Ovaj blok namjerno ne sadrži znakove manje-od, veće-od ni ampersand,
  // jer ih build pretvara u HTML entitete i ruši skriptu.
  document.querySelectorAll('.tr-lca').forEach(function (root) {
    var slide = root.closest('svg');
    var line1 = root.querySelector('.line1');
    var line2 = root.querySelector('.line2');
    var NS = 'http://www.w3.org/2000/svg';
    function mk(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function sv(tag, attrs, parent) {
      var e = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      if (parent) parent.appendChild(e);
      return e;
    }
    function setc(el, cls) { el.setAttribute('class', cls); }
    function show(v) { return v === Infinity ? '∞' : (v === -Infinity ? '−∞' : String(v)); }
    function lt(a, b) { return a !== b ? Math.min(a, b) === a : false; }
    function le(a, b) { return Math.min(a, b) === a; }
    function fw(w) { return lt(w, 0) ? '(' + w + ')' : String(w); }
    function makeRow(box, count, base) {
      var cells = [], vals = [];
      for (var k = 0; k !== count; k++) {
        var cell = mk('div', 'cell');
        cell.appendChild(mk('div', 'idx', k + (base || 0)));
        var v = mk('div', 'val');
        cell.appendChild(v);
        box.appendChild(cell);
        cells.push(cell);
        vals.push(v);
      }
      return { cells: cells, vals: vals };
    }
    function parsePos(s) {
      return s.trim().split(/\s+/).map(function (p) {
        var q = p.split(',').map(Number);
        return { x: q[0], y: q[1] };
      });
    }
    function parseEdges(s) {
      return s.split(',').map(function (t) {
        var q = t.trim().split(':'), ab = q[0].split('-');
        return { a: Number(ab[0]), b: Number(ab[1]), w: q.length === 2 ? Number(q[1]) : 0 };
      });
    }
    // Crta graf u SVG-u: čvorovi su numerirani od 1, bridovi su {a, b, w}
    function drawGraph(box, pos, edges, opt) {
      var R = opt.r || 22;
      var svg = sv('svg', { viewBox: '0 0 ' + opt.w + ' ' + opt.h, width: opt.w, height: opt.h, 'class': 'gsvg' }, box);
      var gE = sv('g', {}, svg), gN = sv('g', {}, svg);
      var E = edges.map(function (e) {
        var A = pos[e.a - 1], B = pos[e.b - 1];
        var dx = B.x - A.x, dy = B.y - A.y, L = Math.sqrt(dx * dx + dy * dy);
        var ux = dx / L, uy = dy / L;
        var x1 = A.x + ux * R, y1 = A.y + uy * R, x2 = B.x - ux * R, y2 = B.y - uy * R;
        var g = sv('g', { 'class': 'e' }, gE);
        sv('line', { x1: x1, y1: y1, x2: x2, y2: y2 }, g);
        if (opt.directed) {
          var bx = x2 - ux * 15, by = y2 - uy * 15;
          sv('polygon', { points: x2 + ',' + y2 + ' ' + (bx - uy * 7) + ',' + (by + ux * 7) + ' ' + (bx + uy * 7) + ',' + (by - ux * 7) }, g);
        }
        if (opt.weights) {
          var t = sv('text', { x: (A.x + B.x) / 2 - uy * 15, y: (A.y + B.y) / 2 + ux * 15, 'class': 'w' }, g);
          t.textContent = e.w;
        }
        return { g: g };
      });
      var N = pos.map(function (p, i) {
        var g = sv('g', { 'class': 'n' }, gN);
        sv('circle', { cx: p.x, cy: p.y, r: R }, g);
        var t = sv('text', { x: p.x, y: p.y, 'class': 'id' }, g);
        t.textContent = i + 1;
        var sub = sv('text', { x: p.x + (opt.subdx || 0), y: p.y + (opt.subdy === undefined ? -R - 13 : opt.subdy), 'class': 'sub' }, g);
        return { g: g, sub: sub };
      });
      return { E: E, N: N, svg: svg };
    }

    var tedges = parseEdges(root.dataset.edges);
    var n = tedges.length + 1;
    var adj = [];
    for (var i0 = 0; i0 !== n + 1; i0++) adj.push([]);
    tedges.forEach(function (e, k) { adj[e.a].push([e.b, k]); adj[e.b].push([e.a, k]); });
    // Raspored: listovi redom slijeva nadesno, roditelj iznad sredine svoje djece
    var px = [], py = [], par = [], parE = [], dep = [], leaf = 0, maxd = 0;
    for (var i1 = 0; i1 !== n + 1; i1++) { px.push(0); py.push(0); par.push(0); parE.push(-1); dep.push(0); }
    function layout(u, p, d) {

      kids.forEach(function (q) { parE[q[0]] = q[1]; layout(q[0], u, d + 1); });
      if (kids.length === 0) { px[u] = leaf; leaf++; }

    }
    layout(1, 0, 0);
    var TW = Number(root.dataset.w), TH = Number(root.dataset.h);
    var stepY = (TH - 70) / Math.max(1, maxd), stepX = (TW - 60) / Math.max(1, leaf - 1);
    var pos = [];
    for (var v0 = 1; v0 !== n + 1; v0++) pos.push({ x: 30 + px[v0] * stepX, y: 44 + dep[v0] * stepY });
    var G = drawGraph(root.querySelector('.graph'), pos, tedges, { w: TW, h: TH, directed: false, weights: false, r: Number(root.dataset.r || 20), subdx: root.dataset.subleft ? -36 : 0, subdy: root.dataset.subleft ? 0 : undefined });

    var LOG = 1;
    while (le(Math.pow(2, LOG), maxd)) LOG++;
    var tbl = root.querySelector('.tbl');
    tbl.style.gridTemplateColumns = '96px repeat(' + n + ', 40px)';
    tbl.appendChild(mk('div', 'th', 'u'));
    var CH = [null];
    for (var c0 = 1; c0 !== n + 1; c0++) CH.push(tbl.appendChild(mk('div', 'th', c0)));
    var T = [];
    for (var i = 0; i !== LOG; i++) {
      tbl.appendChild(mk('div', 'th', 'up[u][' + i + ']'));
      var row = [null];
      for (var c1 = 1; c1 !== n + 1; c1++) row.push(tbl.appendChild(mk('div', 'tc')));
      T.push(row);
    }
    var up = [];
    for (var i2 = 0; i2 !== LOG; i2++) { var r2 = []; for (var v2 = 0; v2 !== n + 1; v2++) r2.push(0); up.push(r2); }
    var snaps = [], filled = 0;
    function snap(o) {

<header>Algoritmi na stablima i LCA</header>
<h1 id="implementacija-tree-diameter">Implementacija: Tree Diameter</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">dfs</span><span class="hljs-params">(<span class="hljs-type">int</span> u, <span class="hljs-type">int</span> p, <span class="hljs-type">int</span> d, <span class="hljs-type">int</span> &amp;max_d, <span class="hljs-type">int</span> &amp;farthest_node)</span> </span>{
    <span class="hljs-keyword">if</span> (d &gt; max_d) {
        max_d = d;
        farthest_node = u;
    }
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> v : adj[u]) {
        <span class="hljs-keyword">if</span> (v != p) <span class="hljs-built_in">dfs</span>(v, u, d + <span class="hljs-number">1</span>, max_d, farthest_node);
    }
}

<span class="hljs-comment">// U main funkciji:</span>
<span class="hljs-type">int</span> max_d = <span class="hljs-number">-1</span>, node_a = <span class="hljs-number">-1</span>, node_b = <span class="hljs-number">-1</span>;
<span class="hljs-built_in">dfs</span>(<span class="hljs-number">1</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, max_d, node_a);      <span class="hljs-comment">// Prvi DFS nalazi node_a</span>
max_d = <span class="hljs-number">-1</span>;
<span class="hljs-built_in">dfs</span>(node_a, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, max_d, node_b); <span class="hljs-comment">// Drugi DFS nalazi node_b i promjer</span>
cout &lt;&lt; max_d &lt;&lt; <span class="hljs-string">&quot;\n&quot;</span>;
</code></pre>

<h1 id="implementacija-distance-queries">Implementacija: Distance Queries</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// Preprocessing: dubine i up[][] tablica (dfs_lca)</span>

<span class="hljs-keyword">while</span> (q--) {
    <span class="hljs-type">int</span> u, v;
    cin &gt;&gt; u &gt;&gt; v;
    <span class="hljs-type">int</span> lca = <span class="hljs-built_in">get_lca</span>(u, v);
    cout &lt;&lt; depth[u] + depth[v] - <span class="hljs-number">2</span> * depth[lca] &lt;&lt; <span class="hljs-string">&quot;\n&quot;</span>;
}
</code></pre>
<p><strong>Napomena:</strong> ovo je standardni obrazac. Ako bridovi imaju težine, umjesto <code>depth</code> (broj bridova) koristimo <code>dist_from_root</code> (zbroj težina).</p>

<header>Algoritmi na stablima i LCA</header>
<h1 id="implementacija-subtree-queries">Implementacija: Subtree Queries</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// 1. DFS za tin/tout</span>
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">dfs</span><span class="hljs-params">(<span class="hljs-type">int</span> u, <span class="hljs-type">int</span> p)</span> </span>{
    tin[u] = ++timer;
    <span class="hljs-comment">// ... rekurzija ...</span>
    tout[u] = timer;
}

<span class="hljs-comment">// Na početku: bit_update(tin[u], val[u]) za svaki čvor u</span>

<span class="hljs-comment">// 2. Update (BIT radi s razlikama, pa pamtimo trenutnu vrijednost)</span>
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">update_node</span><span class="hljs-params">(<span class="hljs-type">int</span> u, <span class="hljs-type">int</span> new_val)</span> </span>{
    <span class="hljs-type">int</span> diff = new_val - current_val[u];
    current_val[u] = new_val;
    <span class="hljs-built_in">bit_update</span>(tin[u], diff); <span class="hljs-comment">// Ažuriramo BIT na poziciji tin[u]</span>
}

<span class="hljs-comment">// 3. Query</span>
<span class="hljs-function"><span class="hljs-type">long</span> <span class="hljs-type">long</span> <span class="hljs-title">query_subtree</span><span class="hljs-params">(<span class="hljs-type">int</span> u)</span> </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">bit_query</span>(tout[u]) - <span class="hljs-built_in">bit_query</span>(tin[u] - <span class="hljs-number">1</span>);
}
</code></pre>

<h1 id="%C5%A1to-smo-danas-nau%C4%8Dili">Što smo danas naučili?</h1>
<ol>
<li>

<li>Ti uvjeti omogućuju brze algoritme (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="5.495ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2429 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g><g data-mml-node="mo" transform="translate(763,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mi" transform="translate(1152,0)"><path data-c="1D441" d="M234 637Q231 637 226 637Q201 637 196 638T191 649Q191 676 202 682Q204 683 299 683Q376 683 387 683T401 677Q612 181 616 168L670 381Q723 592 723 606Q723 633 659 637Q635 637 635 648Q635 650 637 660Q641 676 643 679T653 683Q656 683 684 682T767 680Q817 680 843 681T873 682Q888 682 888 672Q888 650 880 642Q878 637 858 637Q787 633 769 597L620 7Q618 0 599 0Q585 0 582 2Q579 5 453 305L326 604L261 344Q196 88 196 79Q201 46 268 46H278Q284 41 284 38T282 19Q278 6 272 0H259Q228 2 151 2Q123 2 100 2T63 2T46 1Q31 1 31 10Q31 14 34 26T39 40Q41 46 62 46Q130 49 150 85Q154 91 221 362L289 634Q287 635 234 637Z"></path></g><g data-mml-node="mo" transform="translate(2040,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 </ul>
</li>
<li>
<p><strong>Moćni alati:</strong></p>
<ul>
<li><strong>Linearizacija (flattening):</strong> pretvara podstabla u raspone na nizu. Ključna je za upite nad podstablima.</li>
<li><strong>Binary lifting (LCA):</strong> omogućuje &quot;skakanje&quot; po stablu i brzo računanje udaljenosti.</li>
<li><strong>Promjer stabla:</strong> dva DFS-a su standardni trik.</li>
</ul>
</li>
</ol>

<header>Algoritmi na stablima i LCA</header>
<h1 id="osvrt-na-tehnike-rje%C5%A1avanja">Osvrt na tehnike rješavanja</h1>
<ul>
<li>
<p><strong>Transformacija problema:</strong></p>
<ul>
<li>Ako zadatak traži sumu/min/max u <strong>podstablu</strong> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> linearizacija + BIT/segmentno stablo.</li>
<li>Ako zadatak traži nešto na <strong>putu</strong> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> LCA + prefiksne sume (ili HLD za teže slučajeve).</li>
</ul>
</li>
<li>
<p><strong>Binary lifting je univerzalan:</strong></p>
<ul>
<li>Ne služi samo za LCA. Koristi se kad god trebate simulirati &quot;kamo ću stići nakon <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> koraka&quot; u grafu u kojem svaki čvor ima točno jedan izlazni brid.</li>
</ul>
</li>
</ul>
