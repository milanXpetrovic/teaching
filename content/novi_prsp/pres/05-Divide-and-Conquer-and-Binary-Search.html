<h1 id="princip-podijeli-pa-vladaj-divide--conquer">Princip &quot;podijeli pa vladaj&quot; (Divide &amp; Conquer)</h1>
<p>Moćna paradigma koja rješava problem u tri koraka:</p>
<ol>
<li><strong>Podijeli (Divide):</strong> Problem razbijemo na manje podprobleme istog tipa.</li>
<li><strong>Vladaj (Conquer):</strong> Podprobleme riješimo rekurzivno (ili direktno ako su mali).</li>
<li><strong>Kombiniraj (Combine):</strong> Rješenja podproblema spojimo u konačno rješenje.</li>
</ol>

<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="binarno-pretra%C5%BEivanje">Binarno pretraživanje</h1>
<p>Traženje elementa u <strong>sortiranom</strong> nizu.</p>
<ol>
<li><strong>Podijeli:</strong> Nađemo sredinu (<code>mid</code>).</li>
<li><strong>Vladaj:</strong>
<ul>
<li>Ako je <code>arr[mid] == target</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> kraj.</li>
<li>Ako je <code>arr[mid] &gt; target</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> tražimo lijevo.</li>
<li>Ako je <code>arr[mid] &lt; target</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> tražimo desno.</li>
</ul>
</li>
<li><strong>Kombiniraj:</strong> Nema (rezultat podproblema je rezultat cijelog problema).</li>
</ol>

<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="binarno-pretra%C5%BEivanje-u-stl-u">Binarno pretraživanje u STL-u</h1>
<p>Na sortiranom nizu ili <code>set</code>/<code>multiset</code> strukturi:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">vector&lt;<span class="hljs-type">int</span>&gt; v = {<span class="hljs-number">1</span>, <span class="hljs-number">3</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">8</span>};

<span class="hljs-built_in">binary_search</span>(v.<span class="hljs-built_in">begin</span>(), v.<span class="hljs-built_in">end</span>(), <span class="hljs-number">3</span>);   <span class="hljs-comment">// true: postoji li 3?</span>

<span class="hljs-keyword">auto</span> lo = <span class="hljs-built_in">lower_bound</span>(v.<span class="hljs-built_in">begin</span>(), v.<span class="hljs-built_in">end</span>(), <span class="hljs-number">3</span>); <span class="hljs-comment">// prvi element &gt;= 3 (indeks 1)</span>
<span class="hljs-keyword">auto</span> hi = <span class="hljs-built_in">upper_bound</span>(v.<span class="hljs-built_in">begin</span>(), v.<span class="hljs-built_in">end</span>(), <span class="hljs-number">3</span>); <span class="hljs-comment">// prvi element  &gt; 3 (indeks 3)</span>

<span class="hljs-type">int</span> cnt = hi - lo;                       <span class="hljs-comment">// broj pojavljivanja broja 3 (= 2)</span>
</code></pre>
<p>Za <code>set</code> i <code>multiset</code> koristimo metode: <code>s.lower_bound(x)</code>, <code>s.upper_bound(x)</code>.<br />

<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="binarno-pretra%C5%BEivanje-po-rje%C5%A1enju-bs-on-answer">Binarno pretraživanje po rješenju (BS on Answer)</h1>
<p>Jedna od najkorisnijih tehnika u natjecateljskom programiranju.<br />
Koristi se za <strong>optimizacijske probleme</strong> (minimizacija/maksimizacija).</p>
<p><strong>Ideja:</strong><br />
Umjesto traženja optimalnog <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container>, pitamo se:</p>
<blockquote>
<p><em>&quot;Je li moguće postići rješenje s vrijednošću <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container>?&quot;</em></p>
</blockquote>
<p><strong>Uvjet:</strong> Problem mora biti <strong>monoton</strong>.</p>
<ul>
<li>Ako je moguće za <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container>, moguće je i za sve manje od <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container> (ili veće, ovisno o problemu).</li>
<li>To nam omogućuje binarnu pretragu po mogućim vrijednostima rješenja.</li>
</ul>

<ol>
<li>Potpuno u <strong>lijevoj</strong> polovici.</li>

</ol>
<p>Rješenje je <code>max(Lijevo, Desno, Crossing)</code>.</p>

<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="max-subarray-sum-podniz-preko-sredine">Max Subarray Sum: podniz preko sredine</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">long</span> <span class="hljs-type">long</span> <span class="hljs-title">maxCrossingSum</span><span class="hljs-params">(<span class="hljs-type">const</span> vector&lt;<span class="hljs-type">int</span>&gt;&amp; arr, <span class="hljs-type">int</span> l, <span class="hljs-type">int</span> m, <span class="hljs-type">int</span> r)</span> </span>{
    <span class="hljs-type">long</span> <span class="hljs-type">long</span> sum = <span class="hljs-number">0</span>, left_sum = LLONG_MIN;
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = m; i &gt;= l; i--) { <span class="hljs-comment">// Od sredine nalijevo</span>
        sum += arr[i];
        left_sum = <span class="hljs-built_in">max</span>(left_sum, sum);
    }

    sum = <span class="hljs-number">0</span>;
    <span class="hljs-type">long</span> <span class="hljs-type">long</span> right_sum = LLONG_MIN;
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = m + <span class="hljs-number">1</span>; i &lt;= r; i++) { <span class="hljs-comment">// Od sredine nadesno</span>
        sum += arr[i];
        right_sum = <span class="hljs-built_in">max</span>(right_sum, sum);
    }
    <span class="hljs-keyword">return</span> left_sum + right_sum;
}
</code></pre>
<p>Podniz koji prelazi sredinu mora sadržavati <code>arr[m]</code> i <code>arr[m+1]</code>.</p>
<footer>Programiranje za rješavanje složenih problema | Vježbe</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Podijeli pa vladaj i binarno pretraživanje" data-footer="Programiranje za rješavanje složenih problema | Vježbe" data-theme="uniri-beam" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:Podijeli pa vladaj i binarno pretraživanje;--footer:Programiranje za rješavanje složenih problema | Vježbe;--theme:uniri-beam;" data-marpit-pagination-total="25" data-size="16:9">
<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="max-subarray-sum-rekurzija">Max Subarray Sum: rekurzija</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">long</span> <span class="hljs-type">long</span> <span class="hljs-title">maxSubarraySum</span><span class="hljs-params">(<span class="hljs-type">const</span> vector&lt;<span class="hljs-type">int</span>&gt;&amp; arr, <span class="hljs-type">int</span> l, <span class="hljs-type">int</span> r)</span> </span>{
    <span class="hljs-keyword">if</span> (l == r) <span class="hljs-keyword">return</span> arr[l]; <span class="hljs-comment">// Bazni slučaj: jedan element</span>

    <span class="hljs-type">int</span> m = l + (r - l) / <span class="hljs-number">2</span>;
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">max</span>({
        <span class="hljs-built_in">maxSubarraySum</span>(arr, l, m),      <span class="hljs-comment">// Lijevo</span>
        <span class="hljs-built_in">maxSubarraySum</span>(arr, m + <span class="hljs-number">1</span>, r),  <span class="hljs-comment">// Desno</span>
        <span class="hljs-built_in">maxCrossingSum</span>(arr, l, m, r)    <span class="hljs-comment">// Preko sredine</span>
    });
}
</code></pre>

<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="fiksna-to%C4%8Dka-implementacija">Fiksna točka: Implementacija</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span> </span>{
    <span class="hljs-type">int</span> n; cin &gt;&gt; n;
    <span class="hljs-function">vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">a</span><span class="hljs-params">(n)</span></span>;
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> &amp;x : a) cin &gt;&gt; x;

    <span class="hljs-type">int</span> l = <span class="hljs-number">0</span>, r = n - <span class="hljs-number">1</span>, ans = <span class="hljs-number">-1</span>;

    <span class="hljs-keyword">while</span> (l &lt;= r) {
        <span class="hljs-type">int</span> mid = l + (r - l) / <span class="hljs-number">2</span>;

        <span class="hljs-keyword">if</span> (a[mid] == mid) {
            ans = mid;
            <span class="hljs-keyword">break</span>; <span class="hljs-comment">// Našli smo!</span>
        } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (a[mid] &gt; mid) {
            <span class="hljs-comment">// Vrijednost je prevelika, rješenje mora biti lijevo</span>
            <span class="hljs-comment">// (indeks raste sporije od vrijednosti)</span>
            r = mid - <span class="hljs-number">1</span>;
        } <span class="hljs-keyword">else</span> {
            <span class="hljs-comment">// Vrijednost je premala, rješenje mora biti desno</span>
            l = mid + <span class="hljs-number">1</span>;
        }
    }
    cout &lt;&lt; ans &lt;&lt; <span class="hljs-string">&quot;\n&quot;</span>;
}
</code></pre>

<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="provjera-rje%C5%A1enja-greedy-check">Provjera rješenja (Greedy Check)</h1>
<p>Funkcija <code>check(d)</code> vraća <code>true</code> ako možemo postaviti krave s razmakom <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.312ex;" xmlns="http://www.w3.org/2000/svg" width="3.565ex" height="1.882ex" role="img" focusable="false" viewBox="0 -694 1575.8 832"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2265" d="M83 616Q83 624 89 630T99 636Q107 636 253 568T543 431T687 361Q694 356 694 346T687 331Q685 329 395 192L107 56H101Q83 58 83 76Q83 77 83 79Q82 86 98 95Q117 105 248 167Q326 204 378 228L626 346L360 472Q291 505 200 548Q112 589 98 597T83 616ZM84 -118Q84 -108 99 -98H678Q694 -104 694 -118Q694 -130 679 -138H98Q84 -131 84 -118Z"></path></g><g data-mml-node="mi" transform="translate(1055.8,0)"><path data-c="1D451" d="M366 683Q367 683 438 688T511 694Q523 694 523 686Q523 679 450 384T375 83T374 68Q374 26 402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487H491Q506 153 506 145Q506 140 503 129Q490 79 473 48T445 8T417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157Q33 205 53 255T101 341Q148 398 195 420T280 442Q336 442 364 400Q369 394 369 396Q370 400 396 505T424 616Q424 629 417 632T378 637H357Q351 643 351 645T353 664Q358 683 366 683ZM352 326Q329 405 277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q233 26 290 98L298 109L352 326Z"></path></g></g></g></svg></mjx-container>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">check</span><span class="hljs-params">(<span class="hljs-type">long</span> <span class="hljs-type">long</span> d, <span class="hljs-type">int</span> c, <span class="hljs-type">const</span> vector&lt;<span class="hljs-type">int</span>&gt;&amp; stalls)</span> </span>{
    <span class="hljs-type">int</span> cows_placed = <span class="hljs-number">1</span>;
    <span class="hljs-type">int</span> last_pos = stalls[<span class="hljs-number">0</span>]; <span class="hljs-comment">// Prvu kravu uvijek stavimo u prvu štalu</span>

    <span class="hljs-keyword">for</span> (<span class="hljs-type">size_t</span> i = <span class="hljs-number">1</span>; i &lt; stalls.<span class="hljs-built_in">size</span>(); ++i) {
        <span class="hljs-keyword">if</span> (stalls[i] - last_pos &gt;= d) {
            cows_placed++;
            last_pos = stalls[i];
        }
    }
    <span class="hljs-keyword">return</span> cows_placed &gt;= c;
}
</code></pre>
<p><em>Napomena: štale moraju biti sortirane!</em></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Podijeli pa vladaj i binarno pretraživanje" data-footer="Programiranje za rješavanje složenih problema | Vježbe" data-theme="uniri-beam" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:Podijeli pa vladaj i binarno pretraživanje;--footer:Programiranje za rješavanje složenih problema | Vježbe;--theme:uniri-beam;" data-marpit-pagination-total="25" data-size="16:9">
<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="agresivne-krave-glavna-petlja">Agresivne krave: glavna petlja</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span> </span>{
    <span class="hljs-type">int</span> n, c; cin &gt;&gt; n &gt;&gt; c;
    <span class="hljs-function">vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">stalls</span><span class="hljs-params">(n)</span></span>;
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; n; ++i) cin &gt;&gt; stalls[i];

    <span class="hljs-built_in">sort</span>(stalls.<span class="hljs-built_in">begin</span>(), stalls.<span class="hljs-built_in">end</span>()); <span class="hljs-comment">// Obavezno sortiranje</span>

    <span class="hljs-type">long</span> <span class="hljs-type">long</span> l = <span class="hljs-number">0</span>, r = <span class="hljs-number">1e9</span>, ans = <span class="hljs-number">0</span>;

    <span class="hljs-keyword">while</span> (l &lt;= r) {
        <span class="hljs-type">long</span> <span class="hljs-type">long</span> mid = l + (r - l) / <span class="hljs-number">2</span>;

        <span class="hljs-keyword">if</span> (<span class="hljs-built_in">check</span>(mid, c, stalls)) {
            ans = mid;   <span class="hljs-comment">// Ovo je moguće rješenje, spremamo ga</span>
            l = mid + <span class="hljs-number">1</span>; <span class="hljs-comment">// Pokušavamo naći veće</span>
        } <span class="hljs-keyword">else</span> {
            r = mid - <span class="hljs-number">1</span>; <span class="hljs-comment">// Razmak je prevelik, smanjujemo</span>
        }
    }
    cout &lt;&lt; ans &lt;&lt; <span class="hljs-string">&quot;\n&quot;</span>;
}
</code></pre>

<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="implementacija-sum-of-two-values">Implementacija: Sum of Two Values</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">int</span> n, target; cin &gt;&gt; n &gt;&gt; target;
vector&lt;pair&lt;<span class="hljs-type">int</span>, <span class="hljs-type">int</span>&gt;&gt; <span class="hljs-built_in">a</span>(n);
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; n; ++i) {
    cin &gt;&gt; a[i].first;
    a[i].second = i + <span class="hljs-number">1</span>; <span class="hljs-comment">// 1-based indeksiranje</span>
}
<span class="hljs-built_in">sort</span>(a.<span class="hljs-built_in">begin</span>(), a.<span class="hljs-built_in">end</span>());

<span class="hljs-type">int</span> l = <span class="hljs-number">0</span>, r = n - <span class="hljs-number">1</span>;
<span class="hljs-keyword">while</span> (l &lt; r) {
    <span class="hljs-type">int</span> sum = a[l].first + a[r].first;
    <span class="hljs-keyword">if</span> (sum == target) {
        cout &lt;&lt; a[l].second &lt;&lt; <span class="hljs-string">&quot; &quot;</span> &lt;&lt; a[r].second &lt;&lt; <span class="hljs-string">&quot;\n&quot;</span>;
        <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
    }
    <span class="hljs-keyword">if</span> (sum &lt; target) l++;
    <span class="hljs-keyword">else</span> r--;
}
cout &lt;&lt; <span class="hljs-string">&quot;IMPOSSIBLE&quot;</span> &lt;&lt; <span class="hljs-string">&quot;\n&quot;</span>;
</code></pre>

<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="implementacija-factory-machines">Implementacija: Factory Machines</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">long</span> <span class="hljs-type">long</span> n, t; cin &gt;&gt; n &gt;&gt; t;
<span class="hljs-function">vector&lt;<span class="hljs-type">long</span> <span class="hljs-type">long</span>&gt; <span class="hljs-title">k</span><span class="hljs-params">(n)</span></span>;
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; n; ++i) cin &gt;&gt; k[i];

<span class="hljs-type">long</span> <span class="hljs-type">long</span> l = <span class="hljs-number">0</span>, r = <span class="hljs-number">1e18</span>, ans = <span class="hljs-number">1e18</span>; <span class="hljs-comment">// 1e18 je sigurna gornja granica</span>

<span class="hljs-keyword">while</span> (l &lt;= r) {
    <span class="hljs-type">long</span> <span class="hljs-type">long</span> mid = l + (r - l) / <span class="hljs-number">2</span>;
    <span class="hljs-type">long</span> <span class="hljs-type">long</span> products = <span class="hljs-number">0</span>;
    <span class="hljs-keyword">for</span> (<span class="hljs-type">long</span> <span class="hljs-type">long</span> x : k) {
        products += mid / x;
        <span class="hljs-keyword">if</span> (products &gt;= t) <span class="hljs-keyword">break</span>; <span class="hljs-comment">// Optimizacija i zaštita od overflowa</span>
    }

    <span class="hljs-keyword">if</span> (products &gt;= t) {
        ans = mid;
        r = mid - <span class="hljs-number">1</span>;
    } <span class="hljs-keyword">else</span> {
        l = mid + <span class="hljs-number">1</span>;
    }
}
cout &lt;&lt; ans &lt;&lt; <span class="hljs-string">&quot;\n&quot;</span>;
</code></pre>
<footer>Programiranje za rješavanje složenih problema | Vježbe</footer>

<h1 id="analiza-towers">Analiza: Towers</h1>
<p><strong>Problem:</strong><br />
Kocke dolaze jedna po jedna (veličine se mogu ponavljati). Kocku veličine <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container> možemo staviti na vrh postojećeg tornja ako je vrh tog tornja <strong>strogo veći</strong> od <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container>.<br />
Inače započinjemo novi toranj. Treba minimizirati broj tornjeva.</p>
<p><strong>Intuicija:</strong><br />
Pohlepno: kocku <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container> stavljamo na toranj čiji je vrh <strong>najmanji mogući, ali strogo veći od <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container></strong>.<br />
Zašto? Čuvamo velike vrhove za velike kocke koje dolaze kasnije.<br />
Trebamo strukturu koja podržava:</p>
<ol>
<li>Pronalazak najmanjeg elementa <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.09ex;" xmlns="http://www.w3.org/2000/svg" width="4.316ex" height="1.636ex" role="img" focusable="false" viewBox="0 -683 1907.8 723"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3E" d="M84 520Q84 528 88 533T96 539L99 540Q106 540 253 471T544 334L687 265Q694 260 694 250T687 235Q685 233 395 96L107 -40H101Q83 -38 83 -20Q83 -19 83 -17Q82 -10 98 -1Q117 9 248 71Q326 108 378 132L626 250L378 368Q90 504 86 509Q84 513 84 520Z"></path></g><g data-mml-node="mi" transform="translate(1055.8,0)"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container>.</li>
<li>Brisanje tog elementa i ubacivanje <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container>.</li>
</ol>
<p>Koristimo <code>std::multiset</code> i <code>upper_bound</code> (ne <code>lower_bound</code>, jer jednaku kocku ne smijemo staviti na vrh).</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Podijeli pa vladaj i binarno pretraživanje" data-footer="Programiranje za rješavanje složenih problema | Vježbe" data-theme="uniri-beam" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:Podijeli pa vladaj i binarno pretraživanje;--footer:Programiranje za rješavanje složenih problema | Vježbe;--theme:uniri-beam;" data-marpit-pagination-total="25" data-size="16:9">
<header>Podijeli pa vladaj i binarno pretraživanje</header>
<h1 id="implementacija-towers">Implementacija: Towers</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">int</span> n; cin &gt;&gt; n;
multiset&lt;<span class="hljs-type">int</span>&gt; towers;

<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; n; ++i) {
    <span class="hljs-type">int</span> x; cin &gt;&gt; x;

    <span class="hljs-comment">// upper_bound vraća iterator na prvi element strogo veći od x</span>
    <span class="hljs-keyword">auto</span> it = towers.<span class="hljs-built_in">upper_bound</span>(x);

    <span class="hljs-keyword">if</span> (it == towers.<span class="hljs-built_in">end</span>()) {
        <span class="hljs-comment">// Nema većeg elementa -&gt; novi toranj</span>
        towers.<span class="hljs-built_in">insert</span>(x);
    } <span class="hljs-keyword">else</span> {
        <span class="hljs-comment">// Našli smo toranj -&gt; mijenjamo vrh</span>
        towers.<span class="hljs-built_in">erase</span>(it);
        towers.<span class="hljs-built_in">insert</span>(x);
    }
}
cout &lt;&lt; towers.<span class="hljs-built_in">size</span>() &lt;&lt; <span class="hljs-string">&quot;\n&quot;</span>;
</code></pre>
